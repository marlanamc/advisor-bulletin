name: Check Resource Content

# Monthly re-verification queue for the student resource board. Split out of
# check-resource-links.yml (which stays weekly) because the thing it measures
# moves on a 3-6 month clock: re-reporting a 3-month recheck window every week
# was ~13x oversampling, and the answer could not change between runs.
#
# Maintains a single tracking issue (label: resource-review) listing only the
# resources actually past their recheck window. An advisor clears an entry with
# the "Verified today" button on the card in the portal, which stamps
# lastVerified (see markResourceVerified in src/admin-manage.js).

on:
  schedule:
    # 08:00 UTC on the 1st of each month, before the daily snapshot refresh.
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-content:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/service-account.json

      - name: Build the re-verification queue
        id: check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: node scripts/check-resource-content-risk.mjs --json=/tmp/resource-content-report.json

      - name: Update the review queue issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/resource-content-report.json', 'utf8'));
            const { due, totals } = report;
            const stateMarker = '<!-- content-review-state:';

            function readPriorState(body = '') {
              const match = body.match(/<!-- content-review-state:([A-Za-z0-9+/=]+) -->/);
              if (!match) return {};
              try {
                return JSON.parse(Buffer.from(match[1], 'base64').toString('utf8'));
              } catch {
                return {};
              }
            }

            function writeState(state) {
              return `${stateMarker}${Buffer.from(JSON.stringify(state)).toString('base64')} -->`;
            }

            function plural(n, word) {
              return `${n} ${word}${n === 1 ? '' : 's'}`;
            }

            const label = 'resource-review';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: '5319e7', description: 'Resources due for advisor re-verification' });
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.data[0];
            const priorState = readPriorState(existing?.body || '');

            // Split the queue into what is new since last run and what has been
            // sitting there. Only the new part needs reading closely.
            const carried = due.filter((item) => priorState[item.issueKey]);
            const fresh = due.filter((item) => !priorState[item.issueKey]);
            const currentKeys = new Set(due.map((item) => item.issueKey));
            const clearedKeys = Object.keys(priorState).filter((key) => !currentKeys.has(key));
            const somethingChanged = fresh.length > 0 || clearedKeys.length > 0;

            if (!due.length) {
              console.log(`Nothing due: all ${totals.resources} resources are inside their recheck window.`);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Queue is empty as of ${report.checkedAt} — all ${totals.resources} live resources are inside their recheck window. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const nextState = {};
            for (const item of due) {
              const prior = priorState[item.issueKey];
              nextState[item.issueKey] = {
                firstSeen: prior?.firstSeen || report.checkedAt,
                status: item.status,
                resource: item.resource,
                category: item.category,
              };
            }

            function renderItem(item) {
              const out = [`- **${item.resource}** (${item.category}) — ${item.reason}`];
              out.push(`  ${item.advisorAction}`);
              if (item.url) out.push(`  ${item.url}`);
              return out;
            }

            const lines = [];
            lines.push(`**Monthly resource re-verification — ${report.checkedAt.slice(0, 10)}**`);
            lines.push('');
            const freshSentence = fresh.length === 0
              ? 'Nothing new since the last run.'
              : fresh.length === 1
                ? '1 is new since the last run.'
                : `${fresh.length} are new since the last run.`;
            lines.push(`**${plural(due.length, 'resource')} due for a check.** ${freshSentence}`);
            lines.push('');
            lines.push(`Checked ${totals.resources} live resources: ${totals.neverVerified} never verified, ${totals.overdue} past their recheck window, ${totals.badDate} with an unreadable date.`);
            lines.push('');
            lines.push('Clear an entry with the **Verified today** button on the card in the advisor portal.');
            lines.push('');

            if (fresh.length) {
              lines.push(`### New this month (${fresh.length})`);
              for (const item of fresh) lines.push(...renderItem(item));
              lines.push('');
            }

            if (carried.length) {
              lines.push('<details>');
              lines.push(`<summary>Still waiting from earlier runs (${carried.length})</summary>`);
              lines.push('');
              for (const item of carried) lines.push(...renderItem(item));
              lines.push('');
              lines.push('</details>');
              lines.push('');
            }

            lines.push(writeState(nextState));
            const body = lines.join('\n');
            const title = `Resource re-verification: ${plural(due.length, 'card')} due`;

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              if (somethingChanged) {
                const parts = [];
                if (fresh.length) parts.push(`${fresh.length} newly due`);
                if (clearedKeys.length) parts.push(`${clearedKeys.length} verified since the last run`);
                const comment = [`**What changed** — ${parts.join(', ')}.`, ''];
                // Newly due items get a line each because each needs an action.
                // Cleared ones are good news, not a to-do, so they condense to
                // one line — 18 separate "verified" bullets is just scrolling.
                for (const item of fresh) comment.push(`- NEWLY DUE: **${item.resource}** (${item.category}) — ${item.reason}`);
                if (clearedKeys.length) {
                  const names = clearedKeys.map((key) => priorState[key].resource);
                  comment.push(`- CLEARED (${names.length}): ${names.join(', ')}`);
                }
                comment.push('');
                comment.push(`Queue is now ${plural(due.length, 'card')}.`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: comment.join('\n'),
                });
              } else {
                console.log('Queue unchanged since the last run — body refreshed, no comment posted.');
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-content-report
          path: /tmp/resource-content-report.json
          retention-days: 90
          if-no-files-found: warn
