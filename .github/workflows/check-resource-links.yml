name: Check Resource Links

# Weekly liveness check for every resource link on the student board (main
# url + all actionLinks). Reads Firestore directly, not the (potentially
# stale) student-feed-snapshot.json — see "Never audit against the
# snapshot" in docs/DEPLOYMENT.md. This flags broken links, stale redirect
# targets, and links that need a manual browser check; it does not judge
# whether a *better* page exists (see scripts/README.md).
#
# Keeps a single tracking issue (label: link-check) up to date instead of
# opening a new issue every week: updates the body when problems are
# found, closes it when everything's clean again.

on:
  schedule:
    # Mondays at 08:00 UTC (before the daily snapshot refresh at 09:00 UTC).
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/service-account.json

      - name: Check all resource links
        id: check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: node scripts/check-resource-links.mjs --json=/tmp/link-check-report.json

      - name: Check resource content review risk
        id: contentRisk
        # Isolated on purpose: this script exits 1 on error, and without
        # continue-on-error a content-risk failure would skip the link-check
        # issue update below and silently drop that week's broken links.
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: node scripts/check-resource-content-risk.mjs --json=/tmp/resource-content-risk-report.json

      - name: Update or close the tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/link-check-report.json', 'utf8'));
            const { broken, movedDomain, needsManualCheck, forbidden, totals } = report;
            const manualCheck = needsManualCheck || forbidden || [];
            const stateMarker = '<!-- link-check-state:';

            function readPriorState(body = '') {
              const match = body.match(/<!-- link-check-state:([A-Za-z0-9+/=]+) -->/);
              if (!match) return {};
              try {
                return JSON.parse(Buffer.from(match[1], 'base64').toString('utf8'));
              } catch {
                return {};
              }
            }

            function writeState(state) {
              return `${stateMarker}${Buffer.from(JSON.stringify(state)).toString('base64')} -->`;
            }

            function withHistory(items, type, priorState) {
              return items.map((item) => {
                const key = item.issueKey || `${item.id}|${item.kind}|${item.url}`;
                const prior = priorState[key];
                return {
                  ...item,
                  issueKey: key,
                  type,
                  seenWeeks: prior ? prior.seenWeeks + 1 : 1,
                };
              });
            }

            const label = 'link-check';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'd93f0b', description: 'Weekly resource link check findings' });
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.data[0];
            const priorState = readPriorState(existing?.body || '');

            const hasProblems = broken.length > 0 || movedDomain.length > 0 || manualCheck.length > 0;

            if (!hasProblems) {
              console.log(`Clean run: ${totals.ok} ok, 0 moved, 0 needs manual check, 0 broken.`);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All clear as of ${report.checkedAt} — checked ${totals.checked} links, 0 broken. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const brokenWithHistory = withHistory(broken, 'broken', priorState);
            const movedWithHistory = withHistory(movedDomain, 'moved', priorState);
            const manualWithHistory = withHistory(manualCheck, 'manual-check', priorState);
            const nextState = {};
            for (const item of [...brokenWithHistory, ...movedWithHistory, ...manualWithHistory]) {
              nextState[item.issueKey] = {
                seenWeeks: item.seenWeeks,
                type: item.type,
                url: item.url,
                resource: item.resource,
                lastSeen: report.checkedAt,
              };
            }

            function historyText(item) {
              return item.seenWeeks === 1 ? 'first week seen' : `seen ${item.seenWeeks} weeks in a row`;
            }

            function plural(n, word) {
              return `${n} ${word}${n === 1 ? '' : 's'}`;
            }

            // The issue body is refreshed every run, but a comment (and therefore
            // an email) is only worth sending when the finding set actually moved.
            // Otherwise a stable set of automation-blocked hosts generates an
            // identical notification every week and the weekly read stops meaning
            // anything. Diffed against the state blob carried in the issue body.
            const currentItems = [...brokenWithHistory, ...movedWithHistory, ...manualWithHistory];
            const currentKeys = new Set(currentItems.map((i) => i.issueKey));
            const priorKeys = Object.keys(priorState);

            const added = currentItems.filter((i) => !priorState[i.issueKey]);
            const cleared = priorKeys
              .filter((k) => !currentKeys.has(k))
              .map((k) => ({ ...priorState[k], issueKey: k }));
            const recategorized = currentItems.filter(
              (i) => priorState[i.issueKey] && priorState[i.issueKey].type !== i.type
            );
            const somethingChanged = added.length > 0 || cleared.length > 0 || recategorized.length > 0;

            function changeComment() {
              const parts = [];
              if (added.length) parts.push(`${added.length} new`);
              if (cleared.length) parts.push(`${cleared.length} cleared`);
              if (recategorized.length) parts.push(`${recategorized.length} recategorized`);
              const out = [`**What changed** — ${parts.join(', ')} since the last run.`, ''];
              for (const i of added) {
                out.push(`- NEW (${i.type}): **${i.resource}** (${i.kind}) — ${i.url}`);
              }
              for (const i of cleared) {
                out.push(`- CLEARED (was ${i.type}): **${i.resource}** — ${i.url}`);
              }
              for (const i of recategorized) {
                out.push(`- ${priorState[i.issueKey].type} → ${i.type}: **${i.resource}** — ${i.url}`);
              }
              out.push('');
              out.push(`Now: ${brokenWithHistory.length} broken, ${movedWithHistory.length} moved, ${manualReal.length} to check, ${blocked.length} CI-blocked.`);
              return out.join('\n');
            }

            // A 403 or a bot challenge from CI says nothing about the link: GitHub
            // runs from Azure datacenter IPs that mass.gov and friends refuse
            // outright, while the same page loads fine in a browser. Those are
            // ~24 of the ~28 weekly findings, so listing them one by one buries
            // the handful of items that actually need a decision. They are still
            // recorded in the state blob below - only the rendering is grouped.
            const BLOCKED_STATUSES = new Set(['warn-forbidden', 'warn-bot-challenge']);
            const blocked = manualWithHistory.filter((i) => BLOCKED_STATUSES.has(i.status));
            const manualReal = manualWithHistory.filter((i) => !BLOCKED_STATUSES.has(i.status));

            const blockedHosts = new Map();
            for (const item of blocked) {
              let host = item.url;
              try { host = new URL(item.url).hostname.replace(/^www\./i, ''); } catch {}
              const entry = blockedHosts.get(host) || { count: 0, firstWeek: true };
              entry.count += 1;
              if (item.seenWeeks > 1) entry.firstWeek = false;
              blockedHosts.set(host, entry);
            }

            const brokenCount = brokenWithHistory.length;
            const actionableCount = movedWithHistory.length + manualReal.length;
            const verdict = brokenCount > 0
              ? `**${plural(brokenCount, 'link')} need${brokenCount === 1 ? 's' : ''} a card edit this week.**`
              : actionableCount > 0
                ? `**Nothing broken this week.** ${plural(actionableCount, 'item')} below worth a look, none urgent.`
                : '**Nothing broken this week, nothing to do.** The only findings are sites that block automation from CI, which normally work fine in a browser.';

            const lines = [];
            lines.push(`**Weekly resource-link check — ${report.checkedAt}**`);
            lines.push('');
            lines.push(verdict);
            lines.push('');
            lines.push(`Checked ${totals.checked} links across all resources. ${brokenWithHistory.length} broken, ${movedWithHistory.length} domain-moved (still resolving, may want the main url updated), ${manualReal.length} needing a browser check, ${blocked.length} blocked from CI (no action).`);
            lines.push('');
            if (brokenWithHistory.length) {
              lines.push('### Broken — needs a fix');
              for (const b of brokenWithHistory) {
                lines.push(`- **${b.resource}** (${b.kind}): ${b.url} — ${b.reason || `HTTP ${b.httpStatus}`} (${historyText(b)})`);
                lines.push(`  Action: ${b.advisorAction || 'Replace URL, archive the card, or confirm it should stay live.'}`);
              }
            }
            if (movedWithHistory.length) {
              lines.push('');
              lines.push('### Domain moved (still resolving via redirect — safe for now, worth updating the url field)');
              for (const m of movedWithHistory) {
                lines.push(`- **${m.resource}** (${m.kind}): ${m.url} → ${m.finalUrl} (${historyText(m)})`);
                lines.push('  Action: Update the resource URL to the final destination when it is clearly the same official page.');
              }
            }
            if (manualReal.length) {
              lines.push('');
              lines.push('<details>');
              lines.push(`<summary><b>Worth a browser check (${manualReal.length})</b> — certificate chains Node won't verify, timeouts, rate limiting, or temporary server errors</summary>`);
              lines.push('');
              for (const f of manualReal) {
                lines.push(`- **${f.resource}** (${f.kind}): ${f.url} — ${f.reason || `HTTP ${f.httpStatus}`} (${historyText(f)})`);
                lines.push(`  Action: ${f.advisorAction || 'Open in a browser; update only if it is actually unavailable.'}`);
              }
              lines.push('');
              lines.push('</details>');
            }
            if (blocked.length) {
              lines.push('');
              lines.push('<details>');
              lines.push(`<summary>Blocked from CI (${blocked.length} links across ${blockedHosts.size} hosts) — no action needed</summary>`);
              lines.push('');
              lines.push('These sites refuse requests from GitHub\'s datacenter IPs. They are almost certainly fine in a browser, and a genuinely dead page on one of them would show up under Broken above instead.');
              lines.push('');
              for (const [host, entry] of [...blockedHosts.entries()].sort((a, b) => b[1].count - a[1].count)) {
                lines.push(`- ${host} — ${plural(entry.count, 'link')}${entry.firstWeek ? ' — **new this week**' : ''}`);
              }
              lines.push('');
              lines.push('</details>');
            }
            lines.push('');
            lines.push(writeState(nextState));
            const body = lines.join('\n');
            const title = brokenCount > 0
              ? `Weekly resource link check: ${brokenCount} broken`
              : actionableCount > 0
                ? `Weekly resource link check: nothing broken, ${actionableCount} to verify`
                : 'Weekly resource link check: nothing broken';

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              if (somethingChanged) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: changeComment(),
                });
              } else {
                console.log('Nothing changed since the last run — body refreshed, no comment posted.');
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Update resource content review issue
        if: steps.contentRisk.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/resource-content-risk-report.json', 'utf8'));
            const label = 'resource-review';

            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: '5319e7', description: 'Weekly resource content freshness review' });
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.data[0];

            if (!report.reviews.length) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All clear as of ${report.checkedAt} — no resource content review risks found. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const lines = [];
            lines.push(`**Weekly resource content review — ${report.checkedAt}**`);
            lines.push('');
            lines.push(`Checked ${report.totals.resources} live resources. Review queue: ${report.totals.high} high, ${report.totals.medium} medium, ${report.totals.low} low.`);
            lines.push('');
            for (const priority of ['high', 'medium', 'low']) {
              const items = report.reviews.filter((item) => item.priority === priority);
              if (!items.length) continue;
              lines.push(`### ${priority[0].toUpperCase()}${priority.slice(1)} priority`);
              for (const item of items.slice(0, priority === 'low' ? 15 : 30)) {
                const reasons = item.reasons.map((reason) => reason.reason).join(' ');
                const actions = [...new Set(item.reasons.map((reason) => reason.advisorAction))].join(' ');
                lines.push(`- **${item.resource}** (${item.category}, verified: ${item.lastVerified || 'not set'}): ${reasons}`);
                lines.push(`  Action: ${actions}`);
                if (item.url) lines.push(`  URL: ${item.url}`);
              }
              if (items.length > (priority === 'low' ? 15 : 30)) {
                lines.push(`- ...and ${items.length - (priority === 'low' ? 15 : 30)} more ${priority}-priority item(s).`);
              }
              lines.push('');
            }

            const body = lines.join('\n');
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly resource content review queue',
                body,
                labels: [label],
              });
            }

      - name: Post weekly price recheck reminder
        if: always() && steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/link-check-report.json', 'utf8'));
            const { priceReminders } = report;
            if (!priceReminders || !priceReminders.length) return;

            // A price recheck is never "resolved" the way a broken link is — this
            // issue stays open permanently and its body is just refreshed weekly,
            // rather than being opened/closed like the broken-link tracker above.
            const label = 'price-check';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: '0e8a16', description: 'Resources whose stated cost should be spot-checked periodically' });
            }

            const lines = [];
            lines.push(`**Weekly price recheck reminder — ${report.checkedAt}**`);
            lines.push('');
            lines.push('These resource descriptions state a specific dollar figure the org sets independently, so nothing else here would catch it going stale. Worth a quick manual glance:');
            lines.push('');
            for (const p of priceReminders) {
              lines.push(`### ${p.title}`);
              lines.push(`Check against: ${p.checkUrl}`);
              lines.push('');
              lines.push(`Current card text: "${p.currentDescription}"`);
              lines.push('');
            }
            const body = lines.join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.data[0];

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly price recheck reminder',
                body,
                labels: [label],
              });
            }

      # Both reports otherwise live only in /tmp on the runner and vanish with
      # the job, leaving no way to diff one week against the next.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-link-reports
          path: |
            /tmp/link-check-report.json
            /tmp/resource-content-risk-report.json
          retention-days: 90
          if-no-files-found: warn
