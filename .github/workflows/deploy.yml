name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Run unit tests
        run: npm run test:unit

      # `--with-deps` shells out to `apt-get`, which fails the whole step if ANY
      # configured source serves bad metadata — even one we have no use for.
      # The runner image ships third-party sources (Google Chrome, Microsoft
      # prod) and on 2026-09-09 dl.google.com served a Hash Sum mismatch
      # mid-publish, failing this step with apt code 100 and blocking a deploy
      # that had nothing to do with browsers. Playwright downloads its own
      # Chromium build and `--with-deps` only needs Ubuntu archive packages, so
      # drop those sources rather than depend on their availability. The globs
      # cover both the .list and deb822 .sources spellings.
      - name: Drop apt sources Playwright does not need
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs against a local Firebase emulator (see scripts/run-with-emulator.mjs)
      # so this job never touches production Firestore — CI hitting real
      # Firestore across every test/browser project was burning most of the
      # daily read quota on a single push. See "Never audit against the
      # snapshot" in docs/DEPLOYMENT.md for the full story.
      - name: Run Playwright tests
        run: npm test -- --project=desktop --project=mobile

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ebhcs-bulletin-board

      - name: Authenticate for rules deploy
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore and Storage rules
        run: npx firebase-tools deploy --only firestore:rules,storage:uploads --project ebhcs-bulletin-board --non-interactive
